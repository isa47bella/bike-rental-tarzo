<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arfanta Bike Rental - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('tour_bike_AI.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .content {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .content h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .content p {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #25D366 0%, #20BA5A 100%);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.4);
        }

        .instagram-btn {
            background: linear-gradient(135deg, #E4405F 0%, #D81B7A 100%);
            box-shadow: 0 10px 25px rgba(228, 64, 95, 0.3);
        }

        .instagram-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(228, 64, 95, 0.4);
        }

        .website-btn {
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .website-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .contact-btn i {
            font-size: 20px;
        }

        .contact-btn:active {
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .content {
                padding: 40px 25px;
            }

            .content h1 {
                font-size: 26px;
            }

            .contact-btn {
                padding: 14px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="background" id="bgImage"></div>
    <div class="overlay"></div>

    <div class="container">
        <div class="content">
            <h1>Arfanta Bike Rental</h1>
            <p>Contact us for your next cycling adventure!</p>

            <div class="buttons-group">
                <a href="https://wa.me/393928614635" class="contact-btn whatsapp-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i>
                    Contact on WhatsApp
                </a>

                <a href="https://www.instagram.com/arfanta_bikerental/" class="contact-btn instagram-btn" target="_blank">
                    <i class="fab fa-instagram"></i>
                    Follow on Instagram
                </a>

                <a href="https://bike-rental-tarzo-app.vercel.app" class="contact-btn website-btn" target="_blank">
                    <i class="fas fa-globe"></i>
                    Book your bike
                </a>
            </div>
        </div>
    </div>

    
</body>
</html>
